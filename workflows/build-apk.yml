name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -q "$(ls *.zip | head -1)"
      - name: Build
        run: |
          cd "$(dirname "$(find . -name settings.gradle.kts | head -1)")"
          gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NiceUI10-apk
          path: "**/app-debug.apk"
